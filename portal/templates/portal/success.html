{% extends "portal/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-check-circle-fill text-success" style="font-size:4rem"></i>
  <h1 class="h2 mt-2">{{ title }}</h1>
  <p class="lead">{{ message }}</p>
  <div class="d-flex justify-content-center gap-2 flex-wrap mt-3">
    {% for label, url in links %}<a class="btn {% if forloop.first %}btn-dark{% else %}btn-outline-dark{% endif %}" href="{{ url }}">{{ label }}</a>{% endfor %}
    <a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">Dashboard</a>
  </div>
</div>
{% endblock %}
